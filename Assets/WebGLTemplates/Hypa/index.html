<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0806">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0806; color: #f3e6d4; }
      body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-tap-highlight-color: transparent; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .6s; }
      #loading.done { opacity: 0; pointer-events: none; }
      #title { font-size: 28px; font-weight: 600; letter-spacing: .02em; }
      #bar { width: min(240px, 60vw); height: 3px; border-radius: 2px; background: rgba(243, 230, 212, .15); overflow: hidden; }
      #fill { width: 0; height: 100%; background: #e8893a; transition: width .2s; }
      #error { display: none; max-width: 80vw; text-align: center; color: #f3a58a; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div id="title">{{{ PRODUCT_NAME }}}</div>
      <div id="bar"><div id="fill"></div></div>
      <div id="error"></div>
    </div>
    <script>
      // Suppress Firestore WebChannel AbortError rejections on listener teardown before Unity's loader treats them as fatal.
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        var s = r && (r.stack || String(r)) || "";
        if (r && r.name === "AbortError" && s.indexOf("firebase-firestore") !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      // Firebase JS SDK bridge (Assets/Plugins/WebGL/HypaFirebase.jslib). Loads alongside the game and never delays it; if it
      // fails (offline, blocked CDN) the game keeps playing on local data.
      window.hypaFirebase = import("./firebase-bridge.js");
      window.hypaFirebase.catch(function () { console.warn("Hypa: Firebase bridge did not load; playing on local data."); });
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (message, type) { if (type === "error") showError(message); },
      }, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.classList.add("done");
        canvas.focus();
      }).catch(showError);

      function showError(message) {
        document.querySelector("#bar").style.display = "none";
        var error = document.querySelector("#error");
        error.textContent = "Hypa Stories could not start: " + message;
        error.style.display = "block";
      }
    </script>
  </body>
</html>
